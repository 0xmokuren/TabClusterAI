name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      zip: ${{ steps.version.outputs.zip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and lint
        run: npm run check

      - name: Build extension
        run: npm run build

      - name: Resolve version and verify tag match
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "manifest version (v${VERSION}) does not match pushed tag (${TAG})" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip=dist/TabClusterAI-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Verify build output
        run: test -f "${{ steps.version.outputs.zip }}"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: TabClusterAI
          path: ${{ steps.version.outputs.zip }}
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download extension artifact
        uses: actions/download-artifact@v6
        with:
          name: TabClusterAI
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ZIP="dist/TabClusterAI-${VERSION}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Release asset not found: $ZIP" >&2
            ls -la dist/ >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --title "$TAG" \
              --target "${{ github.sha }}" \
              --generate-notes \
              --latest
          fi

  publish-webstore:
    runs-on: ubuntu-latest
    needs:
      - build
      - github-release
    environment: chrome-web-store
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download extension artifact
        uses: actions/download-artifact@v6
        with:
          name: TabClusterAI
          path: dist

      - name: Publish to Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node scripts/release/publish-webstore.mjs
